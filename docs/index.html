<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17211e"><link rel="manifest" href="../public/manifest.webmanifest"><title>Photo Mosaic Motion</title>
<style>
:root{--ink:#17211e;--line:#dfe5e1;--paper:#f5f7f4;--lime:#d8ef79}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px Arial,Helvetica,sans-serif}.app{min-height:100vh;padding:0 clamp(18px,5vw,74px);display:flex;flex-direction:column}.top{height:82px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.13em}.brand{display:flex;gap:11px;align-items:center}.mark{width:27px;height:27px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:16px}.privacy{color:#69736f;font-size:10px;letter-spacing:.04em}.privacy i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#81b742;margin-right:6px}.hero{padding:clamp(45px,8vh,90px) 0 43px;display:flex;justify-content:space-between;align-items:end;gap:30px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#8b9790;font-weight:700;margin:0 0 19px}.hero h1{font-size:clamp(36px,5vw,70px);line-height:.98;letter-spacing:-.07em;margin:0}.hero em{color:#9aaa39;font-style:normal}.intro{color:#75807a;font-size:13px;line-height:1.8;max-width:230px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:clamp(25px,5vw,72px)}.stagebox{position:relative}.stage{aspect-ratio:1.53;background:#1f302b;overflow:hidden;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(6,1fr);position:relative}.backdrop{position:absolute;inset:-3%;background-size:cover;background-position:center;filter:saturate(.75) brightness(.65)}.tile{position:relative;z-index:1;opacity:0;background-size:calc(var(--cols)*100%) 600%;border-right:1px solid #0004;border-bottom:1px solid #0004;animation:assemble 1.45s cubic-bezier(.16,.8,.35,1) forwards}@keyframes assemble{0%{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px)}60%{opacity:1}100%{opacity:1;transform:none;filter:none}}.meta{position:absolute;inset:0;z-index:2;padding:18px 20px;display:flex;justify-content:space-between;color:#fffC;font-size:10px;letter-spacing:.16em;pointer-events:none}.note{position:absolute;z-index:4;bottom:15px;left:18px;color:#fffB;font-size:10px}.play{position:absolute;right:18px;bottom:13px;z-index:5;width:37px;height:37px;border:1px solid #fff8;color:#fff;background:#0f1e1970;border-radius:50%}.panel{border-top:1px solid var(--ink);padding-top:13px}.heading,.row{display:flex;justify-content:space-between;align-items:center}.heading{font-size:10px;letter-spacing:.17em;font-weight:700;margin-bottom:18px}.count{color:#9ba59f;font-size:9px}.upload{height:94px;border:1px dashed #b9c4bd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;position:relative}.upload input{position:absolute;inset:0;opacity:0}.upload small{font-size:9px;color:#9aa59f;font-weight:400}.plus{font-size:21px;color:#8ea63e}.thumbs{display:flex;gap:7px;flex-wrap:wrap;padding:16px 0 20px;border-bottom:1px solid var(--line)}.thumb{width:52px;height:52px;padding:0;border:0;background:none;position:relative}.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.72)}.thumb.active img{outline:2px solid var(--lime);outline-offset:2px;filter:none}.thumb span{position:absolute;left:5px;bottom:4px;color:#fff;font-size:8px;text-shadow:0 1px 4px #000}.settings{padding:19px 0 13px;border-bottom:1px solid var(--line);display:grid;gap:15px;font-size:11px}.speed button,select{border:1px solid var(--line);background:none;color:#7e8983;font-size:10px;padding:6px 8px}.speed button.active{background:var(--ink);color:var(--lime)}.tip{font-size:9px;color:#9aa59f}footer{margin-top:auto;padding:28px 0 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#a0aaa4;font-size:9px;letter-spacing:.14em}@media(max-width:720px){.top{height:65px}.privacy{display:none}.hero{display:block;padding:38px 0 28px}.hero h1{font-size:clamp(35px,10vw,52px)}.intro{margin-top:22px}.workspace{display:block}.stage{aspect-ratio:.83}.panel{margin-top:28px}.thumbs{flex-wrap:nowrap;overflow:auto}.thumb{flex:0 0 54px}footer{margin-top:42px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="mark">M</span><span>MOSAIC MOTION</span></div><span class="privacy"><i></i>기기에서만 처리</span></header><section class="hero"><div><p class="eyebrow">PHOTO SEQUENCE / 01</p><h1>사진이 조각나며<br><em>다음 장면으로</em> 넘어갑니다.</h1></div><p class="intro">사진을 여러 장 추가하고, 격자 조각이 순서대로 맞춰지는 전환을 감상해보세요.</p></section><section class="workspace"><div class="stagebox"><div class="stage" id="stage"><div class="backdrop" id="backdrop"></div><div class="meta"><span id="counter"></span><span>MOSAIC STUDY</span></div></div><button class="play" id="play">Ⅱ</button><div class="note">조각이 순서대로 맞춰지는 중</div></div><aside class="panel"><div class="heading"><span>YOUR SEQUENCE</span><span class="count" id="count"></span></div><label class="upload"><input id="files" type="file" accept="image/*" multiple><span class="plus">＋</span><span>사진 추가하기</span><small>여러 장 선택 가능</small></label><div class="thumbs" id="thumbs"></div><div class="settings"><div class="row"><span>전환 속도</span><span class="speed"><button data-speed=".6">.6×</button><button class="active" data-speed="1">기본</button><button data-speed="1.5">1.5×</button></span></div><div class="row"><span>격자 밀도</span><select id="density"><option value="6">6 × 6</option><option value="8" selected>8 × 6</option><option value="10">10 × 6</option></select></div></div><p class="tip">✦ 사진은 브라우저 안에서만 처리됩니다.</p></aside></section><footer><span>PHOTO MOSAIC MOTION</span><span>터치하여 사진을 바꿔보세요</span><span>2026</span></footer></main>
<script>
const demos=['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=85','https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=85'];let photos=demos.map((url,i)=>({url,name:'demo '+(i+1)})),active=0,playing=true,speed=1,cols=8,timer;const stage=document.querySelector('#stage');const backdrop=document.querySelector('#backdrop');const thumbs=document.querySelector('#thumbs');const counter=document.querySelector('#counter');const count=document.querySelector('#count');
function render(){stage.style.setProperty('--cols',cols);stage.querySelectorAll('.tile').forEach(x=>x.remove());backdrop.style.backgroundImage=`url("${photos[active].url}")`;counter.textContent=`${String(active+1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;count.textContent=`${photos.length} PHOTOS`;const next=photos[(active+1)%photos.length];for(let i=0;i<cols*6;i++){const x=i%cols,y=Math.floor(i/cols),t=document.createElement('div');t.className='tile';t.style.backgroundImage=`url("${next.url}")`;t.style.backgroundPosition=`${x/(cols-1)*100}% ${y/5*100}%`;t.style.animationDelay=`${(i*.035+(i*7%13)*.012).toFixed(3)}s`;stage.append(t)}thumbs.innerHTML='';photos.forEach((p,i)=>{const b=document.createElement('button');b.className='thumb'+(i===active?' active':'');b.innerHTML=`<img src="${p.url}"><span>${String(i+1).padStart(2,'0')}</span>`;b.onclick=()=>{active=i;render()};thumbs.append(b)})}
function autoplay(){clearInterval(timer);if(playing&&photos.length>1)timer=setInterval(()=>{active=(active+1)%photos.length;render()},5200/speed)}document.querySelector('#files').onchange=e=>{const fs=[...e.target.files].filter(f=>f.type.startsWith('image/'));if(fs.length){photos=fs.map(f=>({url:URL.createObjectURL(f),name:f.name}));active=0;render();autoplay()}};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Ⅱ':'▶';autoplay()};document.querySelector('#density').onchange=e=>{cols=+e.target.value;render()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));autoplay()});render();autoplay();
</script></body></html>
